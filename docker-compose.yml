services:
  postgres:
    image: postgres:15-alpine
    container_name: insightsql_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: insightsql
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: insightsql_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  ai_service:
    build:
      context: ./ai_service
    container_name: insightsql_ai_service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/insightsql
      - LLM_PROVIDER=google
      # Will read GOOGLE_API_KEY from host environment or .env
    env_file:
      - .env
    volumes:
      - ./ai_service:/ai_service
      - ./benchmark:/benchmark
    # In docker, PYTHONPATH usually needs to point to the root for absolute imports
    # or the app handles it.

  gateway:
    build:
      context: ./gateway
    container_name: insightsql_gateway
    depends_on:
      - redis
      - ai_service
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai_service:8000
    env_file:
      - .env
    volumes:
      - ./gateway:/app
      - ./benchmark:/benchmark
    command: ["npx", "tsx", "src/index.ts"]

  worker:
    build:
      context: ./gateway
    container_name: insightsql_worker
    depends_on:
      - redis
      - ai_service
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai_service:8000
    env_file:
      - .env
    volumes:
      - ./gateway:/app
      - ./benchmark:/benchmark
    command: ["npx", "tsx", "src/queue/worker.ts"]

  frontend:
    build:
      context: ./frontend
    container_name: insightsql_frontend
    depends_on:
      - gateway
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  pgdata:
  redisdata:
